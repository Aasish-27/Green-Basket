<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Basket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<header class="bg-white shadow-md px-8 py-4 flex items-center justify-between">

    <!-- Logo -->
    <div class="logo text-2xl font-bold text-green-600">
        <i class="fas fa-leaf text-3xl"></i>
        Green Basket
    </div>

    <!-- Search Bar -->
    <div class="search w-1/3">
        <input 
            type="text" 
            placeholder="Search for products..." 
            class="w-full px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-green-400"
        >
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-6">

        <!-- Language -->
        <select class="border px-3 py-1 rounded-md focus:outline-none">
            <option>English</option>
            <option>Nepali</option>
        </select>

        <!-- Navigation -->
         <nav class="flex items-center gap-5 text-gray-700 font-medium">

            <a href="#" class="flex items-center gap-2 hover:text-green-600 transition">
                <i class="fas fa-store"></i>
                <span>Shop</span>
            </a>

            <a href="#" class="flex items-center gap-2 hover:text-green-600 transition">
                <i class="fas fa-shopping-cart"></i>
                <span>Cart</span>
            </a>

            <a href="#" class="flex items-center gap-2 hover:text-green-600 transition">
                <i class="fas fa-heart"></i>
                <span>Wishlist</span>
            </a>

            <!-- Account Dropdown -->
            <div class="relative group">

                <!-- Trigger -->
                <div class="flex items-center gap-2 cursor-pointer px-2 py-1 hover:text-green-600">
                    <i class="fas fa-user"></i>
                    <span>Account</span>
                    <i class="fas fa-chevron-down text-xs"></i>
                </div>

                <!-- Dropdown Menu -->
                <div class="absolute right-0 mt-2 w-40 bg-white border rounded-md shadow-lg 
                            opacity-0 invisible group-hover:opacity-100 group-hover:visible 
                            transition-all duration-200 transform scale-95 group-hover:scale-100">

                    <a href="#" class="block px-4 py-2 hover:bg-gray-100">Login</a>
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100">Register</a>

                </div>

            </div>

        </nav>

    </div>

</header>

</body>
</html>
