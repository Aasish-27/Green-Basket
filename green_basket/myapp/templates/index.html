{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link href="{% static 'src/output.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    {% include "components/header.html" %}
    <section class="mt-10 px-5 md:px-10">
        
        <div class="relative w-full h-[40vh] overflow-hidden rounded-xl">

            <!-- Background Image -->
            <img 
                src="https://images.unsplash.com/photo-1542838132-92c53300491e"
                alt="Fresh groceries"
                class="w-full h-full object-cover"
            >

            <!-- Dark Overlay -->
            <div class="absolute inset-0 bg-black/50"></div>

            <!-- Text Content -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">

                <h1 class="text-3xl md:text-5xl font-bold text-white max-w-2xl">
                    Fresh Groceries Delivered to Your Door
                </h1>

                <p class="mt-4 text-gray-200 max-w-xl">
                    Shop fresh fruits, vegetables, and daily essentials at the best prices.
                </p>

                <!-- Buttons -->
                <div class="mt-6 flex flex-wrap justify-center gap-4">

                    <button class="flex items-center gap-2 bg-green-600 text-white px-6 py-3 rounded-full hover:bg-green-700 transition">
                        <i class="fas fa-shopping-basket"></i>
                        Get Started
                    </button>

                    <button class="flex items-center gap-2 border border-white text-white px-6 py-3 rounded-full hover:bg-white hover:text-green-600 transition">
                        <i class="fas fa-info-circle"></i>
                        Learn More
                    </button>

                </div>

            </div>

        </div>

    </section>
</body>
</html>
